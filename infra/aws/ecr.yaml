AWSTemplateFormatVersion: '2010-09-09'
Description: ProjectSpace backend container repository; image scanning and bounded retention.
Resources:
  BackendRepository:
    Type: AWS::ECR::Repository
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      ImageScanningConfiguration: {ScanOnPush: true}
      EncryptionConfiguration: {EncryptionType: AES256}
      LifecyclePolicy:
        LifecyclePolicyText: '{"rules":[{"rulePriority":1,"description":"Keep 10 recent images","selection":{"tagStatus":"any","countType":"imageCountMoreThan","countNumber":10},"action":{"type":"expire"}}]}'
Outputs:
  RepositoryUri:
    Value: !GetAtt BackendRepository.RepositoryUri
