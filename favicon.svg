<svg width="64" height="64" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fav-bg" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop stopColor="#1d4ed8" />
      <stop offset="40%" stopColor="#3b82f6" />
      <stop offset="75%" stopColor="#6366f1" />
      <stop offset="100%" stopColor="#8b5cf6" />
    </linearGradient>
    <linearGradient id="fav-cap-top" x1="8" y1="12" x2="56" y2="34" gradientUnits="userSpaceOnUse">
      <stop stopColor="#ffffff" />
      <stop offset="60%" stopColor="#e0f2fe" />
      <stop offset="100%" stopColor="#bae6fd" />
    </linearGradient>
    <linearGradient id="fav-star-gold" x1="40" y1="4" x2="58" y2="22" gradientUnits="userSpaceOnUse">
      <stop stopColor="#fef08a" />
      <stop offset="50%" stopColor="#facc15" />
      <stop offset="100%" stopColor="#f59e0b" />
    </linearGradient>
    <filter id="fav-star-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Squircle Base -->
  <rect x="2" y="2" width="60" height="60" rx="18" fill="url(#fav-bg)" stroke="rgba(255,255,255,0.4)" stroke-width="2" />

  <!-- Mortarboard Diamond Board -->
  <polygon points="32,13 57,24.5 32,36 7,24.5" fill="url(#fav-cap-top)" stroke="#ffffff" stroke-width="2" stroke-linejoin="round" />

  <!-- Underneath Skull Cap Band -->
  <path d="M16 29.5V39.5C16 39.5 22.8 47.5 32 47.5C41.2 47.5 48 39.5 48 39.5V29.5" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="rgba(255, 255, 255, 0.22)" />

  <!-- Center Button & Tassel Ribbon -->
  <circle cx="32" cy="24.5" r="3.2" fill="#ffffff" />
  <path d="M32 24.5L13 30.5V42.5" stroke="#fef08a" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round" />
  <circle cx="13" cy="44" r="3.4" fill="#facc15" />

  <!-- Radiant Golden Star of Innovation -->
  <path d="M50 4L52 10L58 12L52 14L50 20L48 14L42 12L48 10Z" fill="url(#fav-star-gold)" filter="url(#fav-star-glow)" />
</svg>
